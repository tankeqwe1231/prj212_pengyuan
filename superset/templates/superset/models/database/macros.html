{% macro testconn(button_class='btn') %}
  <script>
    $("#sqlalchemy_uri").parent()
      .append('<button type="button" id="testconn" class="{{ button_class }}">{{ _("Test Connection") }}</button>');
    $("#testconn").click(function(e) {
      e.preventDefault();
      var $button = $(this);
      var originalText = $button.text();
      var url = "/superset/testconn";
      var csrf_token = "{{ csrf_token() if csrf_token else '' }}";

      $.ajaxSetup({
        beforeSend: function(xhr, settings) {
          if (!/^(GET|HEAD|OPTIONS|TRACE)$/i.test(settings.type) && !this.crossDomain) {
            xhr.setRequestHeader("X-CSRFToken", csrf_token);
          }
        }
      });

      var data = {};
      try{
        data = JSON.stringify({
          uri: $.trim($("#sqlalchemy_uri").val()),
          name: $('#database_name').val(),
          impersonate_user: $('#impersonate_user').is(':checked'),
          extras: JSON.parse($("#extra").val()),
        })
      } catch(parse_error){
        alert("Malformed JSON in the extras field: " + parse_error);
        return false
      }

      $button.prop('disabled', true).text(originalText + '...');
      $.ajax({
        method: "POST",
        url: url,
        data: data,
        dataType: 'json',
        contentType: "application/json; charset=utf-8",
        timeout: 45000
      }).done(function(data) {
          alert("Seems OK!");
      }).fail(function(error) {
          if (error.statusText === 'timeout') {
              alert("ERROR: Connection test timed out.");
              return;
          }
          var respJSON = error.responseJSON;
          var errorMsg = error.responseText;
          if (respJSON && (respJSON.message || respJSON.error)) {
              errorMsg = respJSON.message || respJSON.error;
          }
          alert("ERROR: " + errorMsg);
      }).always(function() {
          $button.prop('disabled', false).text(originalText);
      });
      return false;
    });
  </script>
{% endmacro %}
